name: Build and publish APT repository

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential debhelper devscripts dpkg-dev apt-utils gnupg

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Stage Debian package
        run: |
          mkdir -p artifacts
          cp ../tinhmenhdo-ubuntu_*.deb artifacts/

      - name: Download SKey package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo collyn/skey --pattern 'fcitx5-skey_*_amd64.deb' \
            --dir artifacts --clobber

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: tinhmenhdo-deb
          path: artifacts/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: tinhmenhdo-deb
          path: release-assets

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.deb > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TinhMenhDo Ubuntu $GITHUB_REF_NAME" \
            --generate-notes

  publish:
    needs: build
    if: ${{ vars.PUBLISH_APT == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils gnupg

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: tinhmenhdo-deb
          path: debs

      - name: Import signing key and build repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          mkdir -p public
          gpg --batch --armor --export "$APT_GPG_KEY_ID" > public/public.key
          repo/build-repo.sh ./debs ./public noble "$APT_GPG_KEY_ID" "amd64 arm64"
          repo/build-repo.sh ./debs ./public resolute "$APT_GPG_KEY_ID" "amd64 arm64"

      - name: Verify APT paths
        run: |
          for packages in public/dists/*/main/binary-*/Packages; do
            awk -F': ' \
              '$1 == "Filename" && $2 !~ /^pool\/main\/[^/]+\.deb$/ { print FILENAME ": " $0; bad = 1 } END { exit bad }' \
              "$packages"
          done
          if grep -R -E '(^|/)(public/|\.\./|/home/)' public/dists; then
            echo 'APT metadata contains a local/staging path' >&2
            exit 1
          fi

      - name: Prepare installer
        env:
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          repo_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          cp install-tinhmenhdo.sh public/install-tinhmenhdo.sh
          sed -i \
            -e "s|https://YOUR-USER.github.io/tinhmenhdo-ubuntu|$repo_url|" \
            -e "s|REPLACE_WITH_REPO_KEY_FINGERPRINT|$APT_GPG_KEY_ID|" \
            public/install-tinhmenhdo.sh
          if grep -Eq 'YOUR-USER\.github\.io|REPLACE_WITH_REPO_KEY_FINGERPRINT' public/install-tinhmenhdo.sh; then
            echo 'Published installer still contains a placeholder' >&2
            exit 1
          fi
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>TinhMenhDo Ubuntu Repository</title>
          <h1>TinhMenhDo Ubuntu Repository</h1>
          <p>APT repository for the TinhMenhDo Ubuntu vanilla GNOME profile.</p>
          <p><a href="install-tinhmenhdo.sh">Download the installer</a></p>
          <p><a href="public.key">Download the repository public key</a></p>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
